name: ReviewBar
options:
  bundleIdPrefix: com.reviewbar
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ReviewBar:
    type: application
    platform: iOS
    sources:
      - path: ReviewBar
    info:
      path: ReviewBar/Support/Info.plist
      properties:
        CFBundleDisplayName: ReviewBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        ReviewBarRelayBaseURL: $(REVIEWBAR_RELAY_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewbar.ReviewBar
        PRODUCT_NAME: ReviewBar
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z38CPBG8G6
        DEVELOPMENT_ASSET_PATHS: '"ReviewBar/Preview Content"'
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ReviewBar/Support/ReviewBar.entitlements
        REVIEWBAR_RELAY_BASE_URL: ""
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  ReviewBarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReviewBarTests
    dependencies:
      - target: ReviewBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewbar.ReviewBarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReviewBar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ReviewBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ReviewBarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReviewBarUITests
    dependencies:
      - target: ReviewBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewbar.ReviewBarUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReviewBar
schemes:
  ReviewBar:
    build:
      targets:
        ReviewBar: all
        ReviewBarTests: [test]
        ReviewBarUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: ReviewBarTests
        - name: ReviewBarUITests
    run:
      config: Debug
  ReviewBar Service-Free Tests:
    build:
      targets:
        ReviewBar: all
        ReviewBarTests: [test]
        ReviewBarUITests: [test]
    test:
      config: Debug
      commandLineArguments:
        "-reviewbar-service-free-tests": true
      gatherCoverageData: true
      targets:
        - name: ReviewBarTests
          selectedTests: [StartupTests]
        - name: ReviewBarUITests
          selectedTests: [ReviewBarUITests/testServiceFreeHost()]
    run:
      config: Debug
      commandLineArguments:
        "-reviewbar-service-free-tests": true
